name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Asn1Toolchain.sln
      - name: Build (warnings as errors)
        run: dotnet build Asn1Toolchain.sln --no-restore -c Release
      - name: Format check
        run: dotnet format Asn1Toolchain.sln --verify-no-changes --no-restore
      - name: Fetch extended corpus
        run: scripts/fetch-extended-corpus.sh
      - name: Test
        run: |
          for p in tests/*/; do
            dotnet test --project "$p" -c Release --no-build || exit 1
          done
      - name: CLI smoke test
        run: |
          dotnet src/Asn1.Cli/bin/Release/net10.0/asn1.dll lint samples --encoding-rules uper
          dotnet src/Asn1.Cli/bin/Release/net10.0/asn1.dll encode samples/telemetry/telemetry.asn -t Heartbeat -f uper --value '{"sequenceNumber":7,"uptimeSeconds":4000000000}'

  studio-editor:
    # wwwroot/js/editor.js is committed (the Studio builds without Node); it must match its sources.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/Asn1.Studio/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/Asn1.Studio/editor/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: The committed bundle is up to date
        run: git diff --exit-code -- ../wwwroot/js/editor.js ../wwwroot/js/editor.LICENSE.txt

  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Set up Emscripten (for NativeAOT-LLVM)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56
          actions-cache-folder: emsdk-cache
      - name: Build the CLI
        working-directory: .
        run: dotnet build src/Asn1.Cli -c Release
      - name: Install
        run: npm ci
      - name: Generate TypeScript and schemas for the test vectors
        run: npm run generate -w @dotasn/wasm
      - name: Build the WebAssembly runtime (NativeAOT-LLVM)
        run: npm run build:native -w @dotasn/wasm
      - name: Type-check
        run: npm run typecheck --workspaces
      - name: Test (asn1tools vectors through the WebAssembly runtime, value notation)
        run: npm test --workspaces
      - name: Build and pack
        run: |
          npm run build --workspaces
          npm pack --dry-run --workspaces
