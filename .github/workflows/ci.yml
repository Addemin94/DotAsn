name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Asn1Toolchain.sln
      - name: Build (warnings as errors)
        run: dotnet build Asn1Toolchain.sln --no-restore -c Release
      - name: Format check
        run: dotnet format Asn1Toolchain.sln --verify-no-changes --no-restore
      - name: Fetch extended corpus
        run: scripts/fetch-extended-corpus.sh
      - name: Test
        run: |
          for p in tests/*/; do
            dotnet test --project "$p" -c Release --no-build || exit 1
          done
      - name: CLI smoke test
        run: |
          dotnet src/Asn1.Cli/bin/Release/net10.0/asn1.dll lint samples --encoding-rules uper
          dotnet src/Asn1.Cli/bin/Release/net10.0/asn1.dll encode samples/telemetry/telemetry.asn -t Heartbeat -f uper --value '{"sequenceNumber":7,"uptimeSeconds":4000000000}'
